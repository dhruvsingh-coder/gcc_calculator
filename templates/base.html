<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCC Setup Cost Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gatewai-bg.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
    <style>
        /* Smooth scroll for the page */
        html {
            scroll-behavior: smooth;
        }
        
        /* Results section highlight animation */
        @keyframes highlightResults {
            0% { box-shadow: 0 0 0 0 rgba(255, 127, 65, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 127, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 127, 65, 0); }
        }
        
        .highlight-results {
            animation: highlightResults 2s ease;
            border-radius: 8px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }
        
        .results-card {
            position: relative;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Gatewai Background Elements -->
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>
    <div class="grid-overlay"></div>

    <!-- Main Container -->
    <div class="container-fluid main-container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Headcount input functions
        function updateHeadcountFromSlider(value) {
            const headcountInput = document.getElementById('headcount-input');
            if (headcountInput) {
                headcountInput.value = value;
            }
            updatePlanDetailsBasedOnHeadcount(value);
        }

        function updateHeadcountFromInput(value) {
            const headcountSlider = document.getElementById('headcount');
            // Ensure value is within range
            if (value < 1) value = 1;
            if (value > 1000) value = 1000;
            
            if (headcountSlider) {
                headcountSlider.value = value;
            }
            updatePlanDetailsBasedOnHeadcount(value);
        }

        function updatePlanDetailsBasedOnHeadcount(headcount) {
            const planElement = document.getElementById('plan');
            if (planElement && typeof updatePlanDetails === 'function') {
                const currentPlan = planElement.value;
                updatePlanDetails(currentPlan, parseInt(headcount));
            }
        }

        // Function to submit form directly and trigger scroll
        function submitFormDirectly() {
            const calculateBtn = document.querySelector('button[type="submit"]') || 
                               document.querySelector('button.btn-primary.w-100');
            if (calculateBtn) {
                const originalText = calculateBtn.innerHTML;
                
                // Show loading state
                calculateBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Calculating...';
                calculateBtn.disabled = true;
                
                // Set flag for auto-scroll to results
                sessionStorage.setItem('shouldScrollToResults', 'true');
                
                // Submit the form
                const form = document.getElementById('calculator-form');
                if (form) {
                    form.submit();
                }
                
                // Restore button after a timeout (in case submission fails)
                setTimeout(() => {
                    calculateBtn.innerHTML = originalText;
                    calculateBtn.disabled = false;
                }, 3000);
            } else {
                // Fallback: submit form directly
                sessionStorage.setItem('shouldScrollToResults', 'true');
                const form = document.getElementById('calculator-form');
                if (form) {
                    form.submit();
                }
            }
        }

        // Function to scroll to results section
        function scrollToResults() {
            // Try multiple ways to find results section
            let resultsSection = document.getElementById('results-section');
            
            if (!resultsSection) {
                // Look for results by heading
                const resultsHeadings = document.querySelectorAll('h2, h3, h4, h5, h6');
                for (const heading of resultsHeadings) {
                    if (heading.textContent.includes('Calculation Results') || 
                        heading.textContent.includes('Results') ||
                        heading.textContent.includes('Total Cost')) {
                        resultsSection = heading.closest('.content-card') || 
                                        heading.closest('.card') || 
                                        heading.closest('.results-container');
                        if (resultsSection && !resultsSection.id) {
                            resultsSection.id = 'results-section';
                        }
                        break;
                    }
                }
            }
            
            if (resultsSection) {
                // Add highlight animation
                resultsSection.classList.add('highlight-results');
                resultsSection.classList.add('fade-in-up');
                
                // Smooth scroll to results
                setTimeout(() => {
                    resultsSection.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start'
                    });
                }, 100);
                
                // Remove highlight after animation
                setTimeout(() => {
                    resultsSection.classList.remove('highlight-results');
                }, 2000);
            } else {
                // If still not found, scroll to top of page
                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 100);
            }
        }

        // Check if we should scroll to results on page load
        function checkAndScrollToResults() {
            const shouldScroll = sessionStorage.getItem('shouldScrollToResults');
            if (shouldScroll === 'true') {
                // Clear the flag
                sessionStorage.removeItem('shouldScrollToResults');
                
                // Scroll to results after a short delay to ensure page is fully loaded
                setTimeout(() => {
                    scrollToResults();
                }, 500); // Increased delay for better reliability
            }
        }

        // Setup form submission
        function setupFormSubmission() {
            const form = document.getElementById('calculator-form');
            if (form) {
                // Make sure calculate button submits with scroll trigger
                const calculateBtn = form.querySelector('button[type="submit"]') || 
                                   form.querySelector('button.btn-primary');
                if (calculateBtn) {
                    calculateBtn.onclick = function(e) {
                        e.preventDefault();
                        submitFormDirectly();
                        return false;
                    };
                }
            }
        }

        // Enhanced DOMContentLoaded event
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize headcount inputs
            const headcountInput = document.getElementById('headcount-input');
            const headcountSlider = document.getElementById('headcount');
            if (headcountInput && headcountSlider) {
                headcountInput.value = headcountSlider.value;
            }

            // Setup form submission
            setupFormSubmission();
            
            // Check if we should scroll to results
            checkAndScrollToResults();

            // Mark any existing results section
            const resultsElements = document.querySelectorAll('[class*="result"], [id*="result"]');
            resultsElements.forEach(element => {
                if (element.classList.contains('content-card') || 
                    element.classList.contains('card') ||
                    element.textContent.includes('Total') ||
                    element.textContent.includes('Cost')) {
                    if (!element.id) {
                        element.id = 'results-section';
                    }
                }
            });
        });
    </script>
</body>
</html>
